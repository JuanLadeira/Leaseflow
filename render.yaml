# Render Blueprint: https://render.com/docs/blueprint-spec
# One click in the Render dashboard (New → Blueprint → this repo) creates:
#   leaseflow-db   free PostgreSQL
#   leaseflow-api  Django + Ninja on uvicorn, built from compose/backend/Dockerfile (prod stage)
#   leaseflow-web  the React build as a static site on Render's CDN
# Free web services sleep after ~15 min idle; the first request then takes ~1 min.

databases:
  - name: leaseflow-db
    plan: free
    databaseName: leaseflow
    user: leaseflow

services:
  - type: web
    name: leaseflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./compose/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: leaseflow-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_BEHIND_PROXY
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: leaseflow-web
          property: host
      # migrate + seed the demo data on boot (seed is skipped when data exists)
      - key: SEED_DEMO
        value: "true"
      # Set in the dashboard when Render asks for it; never committed.
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: leaseflow-web
    runtime: static
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_HOST
        fromService:
          type: web
          name: leaseflow-api
          property: host
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
